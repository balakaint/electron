<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The renderer talks to the engine over IPC, never over its own
      network stack — grep the renderer for fetch()/XMLHttpRequest and
      there is nothing. So a policy this tight costs the app nothing and
      means an XSS (from typed content, or a compromised dependency)
      has nowhere to send what it reads.

      connect-src keeps ws: only for Vite's dev hot reload; a packaged
      build opens no sockets at all. img-src needs data: because
      read-image deliberately returns a data URL rather than exposing
      file:// to the renderer.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self';
               style-src 'self' 'unsafe-inline';
               img-src 'self' data:;
               font-src 'self' data:;
               connect-src 'self' ws: wss:;
               object-src 'none';
               base-uri 'none';
               form-action 'none';
               frame-ancestors 'none'"
    />
    <title>Habit OS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
